<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baraka Food — Suivi de commande</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/pager/pager.css" />
  <style>
    body {
      justify-content: center;
      text-align: center;
    }

    .lead {
      font-size: 0.95rem;
      color: #777777;
      margin-bottom: 1.8rem;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .form input {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 1.6rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #ededea;
      background: #161616;
      border: none;
      border-radius: 6px;
      padding: 0.9em 1em;
    }

    .form input::placeholder {
      color: #444444;
      letter-spacing: 0.05em;
    }

    .form button {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #0d0d0d;
      background: #ededea;
      border: none;
      border-radius: 6px;
      padding: 1em;
    }

    .error {
      color: #ff8080;
      font-size: 0.85rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="brand"><img src="/pager/logo.svg" alt="Baraka Food" /></div>

  <div class="wrap">
    <div>
      <p class="lead">Entrez le numéro indiqué sur votre ticket pour suivre votre commande</p>
      <form class="form" id="form">
        <input id="code" type="text" placeholder="N° de commande" maxlength="8" autofocus />
        <button type="submit">Suivre ma commande</button>
      </form>
      <p class="error" id="error"></p>
    </div>
  </div>

  <script src="/pager/saisie.js"></script>
</body>
</html>
