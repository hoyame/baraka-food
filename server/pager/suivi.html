<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baraka Food — Suivi de commande</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/pager/pager.css" />
  <style>
    body {
      justify-content: center;
      text-align: center;
    }

    .code {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #777777;
      margin-bottom: 1.5rem;
    }

    .status-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      padding: 3rem 2rem;
      border-radius: 8px;
      background: #161616;
      transition: background 0.4s ease;
    }

    .status-box.is-ready {
      background: #ededea;
      animation: pulse 1s ease infinite;
    }

    .status-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #ededea;
    }

    .is-ready .status-title {
      color: #0d0d0d;
    }

    .status-desc {
      font-size: 0.95rem;
      color: #777777;
    }

    .is-ready .status-desc {
      color: rgba(13, 13, 13, 0.55);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ededea;
      animation: blink 1.2s ease infinite;
    }

    .is-ready .dot {
      display: none;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .error {
      color: #ff8080;
      font-size: 0.9rem;
    }

    .change-link {
      display: inline-block;
      margin-top: 1.5rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #777777;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="brand"><img src="/pager/logo.svg" alt="Baraka Food" /></div>

  <div class="wrap">
    <div>
      <p class="code" id="code-label"></p>
      <div class="status-box" id="box">
        <span class="dot" id="dot"></span>
        <h1 class="status-title" id="title">Chargement…</h1>
        <p class="status-desc" id="desc"></p>
      </div>
      <p class="error" id="error"></p>
      <a class="change-link" href="/suivi">Changer de numéro</a>
    </div>
  </div>

  <script src="/pager/suivi.js"></script>
</body>
</html>
