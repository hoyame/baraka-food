<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baraka Food — Cuisine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/pager/pager.css" />
  <style>
    .wrap {
      max-width: 900px;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      align-items: start;
    }

    @media (max-width: 800px) {
      .columns {
        grid-template-columns: 1fr;
      }
    }

    .col-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      color: #777777;
      margin-bottom: 0.7rem;
    }

    .col-list {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .empty {
      text-align: center;
      color: #333333;
      font-size: 0.8rem;
      padding: 1rem 0;
    }

    .card {
      background: #161616;
      border-radius: 6px;
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .code {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: 1.15rem;
    }

    .time {
      font-size: 0.7rem;
      color: #444444;
    }

    .items {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .item-line {
      font-size: 0.82rem;
      display: flex;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .item-name {
      color: #ededea;
    }

    .item-qty {
      color: #777777;
      flex-shrink: 0;
    }

    .item-notes {
      font-size: 0.72rem;
      color: #b98b52;
      font-weight: 500;
    }

    .btn {
      font-weight: 800;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      border: none;
      border-radius: 4px;
      padding: 0.7em 0.9em;
      background: #ededea;
      color: #0d0d0d;
    }

    .btn--ghost {
      background: rgba(255, 255, 255, 0.08);
      color: #ededea;
    }
  </style>
</head>
<body>
  <div class="brand"><img src="/pager/logo.svg" alt="Baraka Food" /></div>

  <div class="wrap">
    <div class="columns">
      <div>
        <p class="col-title">En attente</p>
        <div class="col-list" id="col-attente"></div>
      </div>
      <div>
        <p class="col-title">En préparation</p>
        <div class="col-list" id="col-preparation"></div>
      </div>
      <div>
        <p class="col-title">Prêt en cuisine</p>
        <div class="col-list" id="col-pret_cuisine"></div>
      </div>
    </div>
  </div>

  <script src="/pager/cuisine.js"></script>
</body>
</html>
